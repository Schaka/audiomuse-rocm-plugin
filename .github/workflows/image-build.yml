name: Build ROCm worker image

# Reusable per-arch build of docker/Dockerfile. Called by image-stable.yml and
# image-unstable.yml, which decide WHEN to build and which core image to bake;
# this file only decides HOW.
#
# One tag per arch rather than a multi-arch manifest, same as the base images in
# Schaka/rocm-migraphx-ort-builder: each arch's ROCm kernel binaries are large
# enough that baking several into one image overruns a hosted runner's disk.

on:
  workflow_call:
    inputs:
      core-image:
        description: 'Fully qualified AudioMuse-AI core image to COPY /app from (pin by digest or version).'
        required: true
        type: string
      version:
        description: 'Release version without the v (e.g. 3.0.5). Empty builds the unstable channel.'
        required: false
        type: string
        default: ''

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      # Kept in step with rocm-migraphx-ort-builder's published base images: the
      # nightly matrix plus the separately-built Polaris variant.
      matrix:
        arch:
          - gfx900
          - gfx906
          - gfx908
          - gfx90a
          - gfx942
          - gfx1030
          - gfx1100
          - gfx1101
          - gfx1102
          - gfx1150
          - gfx1151
          - gfx1200
          - gfx1201
          # Polaris. Same base package as the rest, but that tag is built on
          # ROCm 6 rather than 7 - which is what CT2_VARIANT below reacts to.
          - gfx803
    steps:
      # The ROCm base and the core image are both large; the runner's stock
      # ~14GB of free disk is not enough to pull both and write the result.
      - uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: false

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        run: |
          owner="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}"
          self="${owner}/audiomuse-ai-rocm"
          arch="${{ matrix.arch }}"
          version="${{ inputs.version }}"

          base="${owner}/rocm-migraphx-ort-torch-builder:latest-${arch}"
          echo "base=${base}" >> "$GITHUB_OUTPUT"

          # CTranslate2 comes in three flavours, because upstream's prebuilt
          # ROCm wheel is built on ROCm 7 for gfx1030 and newer only
          # (python/tools/prepare_build_environment_linux_rocm.sh):
          #
          #   gfx803        ROCm 6 base -> the wheel wants libhipblas.so.3 and
          #                 fails at import; build the ROCm fork.
          #   gfx9xx        ROCm 7 base, but outside the wheel's arch list, so
          #                 it would import cleanly and then fail at the first
          #                 GPU transcribe; build upstream for this arch.
          #   gfx1030+      covered by the wheel as published.
          ct2_repo="https://github.com/OpenNMT/CTranslate2.git"
          ct2_ref="v4.8.1"
          case "$arch" in
            gfx803)
              ct2_variant="source"
              ct2_repo="https://github.com/arlo-phoenix/CTranslate2-rocm.git"
              ct2_ref="rocm"
              ;;
            gfx900|gfx906|gfx908|gfx90a|gfx942)
              ct2_variant="source"
              ;;
            *)
              ct2_variant="prebuilt"
              ;;
          esac
          echo "ct2-variant=${ct2_variant}" >> "$GITHUB_OUTPUT"
          echo "ct2-repo=${ct2_repo}" >> "$GITHUB_OUTPUT"
          echo "ct2-ref=${ct2_ref}" >> "$GITHUB_OUTPUT"

          if [ -n "$version" ]; then
            channel="stable"
            tags="${self}:${version}-${arch},${self}:latest-${arch}"
          else
            channel="unstable"
            tags="${self}:unstable-${arch},${self}:unstable-$(date -u +%Y%m%d)-${arch}"
          fi
          echo "tags=${tags}" >> "$GITHUB_OUTPUT"
          # Registry cache, not type=gha: GitHub caps Actions cache at 10GB per
          # repo, which 14 arches of ROCm layers would evict on every run.
          echo "cache=${self}:cache-${channel}-${arch}" >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BASE_IMAGE=${{ steps.meta.outputs.base }}
            CORE_IMAGE=${{ inputs.core-image }}
            CT2_VARIANT=${{ steps.meta.outputs.ct2-variant }}
            CT2_REPO=${{ steps.meta.outputs.ct2-repo }}
            CT2_REF=${{ steps.meta.outputs.ct2-ref }}
            ROCM_ARCH=${{ matrix.arch }}
          cache-from: type=registry,ref=${{ steps.meta.outputs.cache }}
          cache-to: type=registry,ref=${{ steps.meta.outputs.cache }},mode=max
