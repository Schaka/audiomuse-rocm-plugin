# AudioMuse-AI ROCm Accelerator plugin - local build + test compose.
#
# Builds docker/Dockerfile (AudioMuse-AI core, pulled from the published image,
# plus the ROCm runtime) and passes an AMD GPU to the worker. The AMD behaviour
# is added at runtime by the ROCm Accelerator plugin, served here by the
# `plugin-catalog` sidecar so you can install it from the Plugins UI.
#
# Prereqs: ROCm 7.x kernel driver (amdgpu), host user in `render`/`video` groups.
# (gfx803/Polaris runs ROCm 6.x instead - see ROCM_BASE_IMAGE below.)
#
# Usage (from this repo's root):
#   docker compose -f local-test/docker-compose-rocm.yaml up --build
#
# To test a different arch, override the base image:
#   ROCM_BASE_IMAGE=ghcr.io/schaka/rocm-migraphx-ort-torch-builder:latest-gfx1030 \
#     docker compose -f local-test/docker-compose-rocm.yaml up --build
# gfx803 also needs CT2_VARIANT/CT2_REPO/ROCM_ARCH; build-gfx803.sh sets them.
#
# Then, in the web UI (http://localhost:8000):
#   1. Log in as admin, open Plugins > Repositories.
#   2. Add repository:  http://plugin-catalog:8099/manifest.json
#   3. Catalog tab > install "ROCm Accelerator (AMD)" > Apply now (restart).
#   4. Start an analysis. Worker logs should show the MIGraphX ONNX provider
#      chain for musicnn and faster-whisper for lyrics; confirm GPU use with
#      `rocm-smi` on the host.

x-rocm-build: &rocm-build
  context: ..
  dockerfile: docker/Dockerfile
  args:
    BASE_IMAGE: ${ROCM_BASE_IMAGE:-ghcr.io/schaka/rocm-migraphx-ort-torch-builder:latest-gfx1201}
    # The published core is still older than the plugin's min_core_version, so
    # override this with your own core build to see the plugin in the catalog:
    #   CORE_IMAGE=audiomuse-ai:local docker compose -f ... up --build
    CORE_IMAGE: ${CORE_IMAGE:-ghcr.io/neptunehub/audiomuse-ai:latest}
    # "prebuilt" takes CTranslate2's ROCm release wheel, which only covers
    # gfx1030+; "source" compiles CT2_REPO@CT2_REF for ROCM_ARCH, which gfx803
    # (ROCm 6 -> the fork) and gfx9xx (outside the wheel's arch list ->
    # upstream) both need. See docker/Dockerfile's ct2-* stages.
    CT2_VARIANT: ${CT2_VARIANT:-prebuilt}
    CT2_REPO: ${CT2_REPO:-https://github.com/OpenNMT/CTranslate2.git}
    CT2_REF: ${CT2_REF:-v4.8.1}
    ROCM_ARCH: ${ROCM_ARCH:-gfx1201}

services:
  redis:
    image: redis:7-alpine
    container_name: audiomuse-redis
    environment:
      TZ: "${TZ:-UTC}"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres:
    image: postgres:15-alpine
    container_name: audiomuse-postgres
    environment:
      TZ: "${TZ:-UTC}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: "audiomusedb"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  # Serves a local plugin catalog derived from plugin/rocm_accelerator so the
  # plugin can be installed from the UI without a public repository.
  plugin-catalog:
    image: python:3.12-alpine
    container_name: audiomuse-plugin-catalog
    working_dir: /src
    volumes:
      - ..:/src:ro
    command:
      - sh
      - -ec
      - |
        mkdir -p /catalog
        cd /src/plugin
        python -m zipfile -c /catalog/rocm_accelerator.zip rocm_accelerator
        python -c "import json; d=json.load(open('/src/plugin/rocm_accelerator/plugin.json')); b='http://plugin-catalog:8099'; v=[{'version':d['version'],'min_core_version':d.get('min_core_version'),'changelog':d.get('changelog',''),'sourceUrl':b+'/rocm_accelerator.zip'}]; json.dump({'id':d['id'],'name':d['name'],'author':d['author'],'description':d['description'],'targets':d.get('targets',[]),'requirements':d.get('requirements',[]),'versions':v},open('/catalog/plugin.json','w')); m={'plugins':[{'id':d['id'],'name':d['name'],'author':d['author'],'description':d['description'],'pluginUrl':b+'/plugin.json'}]}; json.dump(m,open('/catalog/manifest.json','w'))"
        cd /catalog
        exec python -m http.server 8099
    restart: unless-stopped

  audiomuse-ai-flask:
    build: *rocm-build
    image: audiomuse-ai-rocm:local
    container_name: audiomuse-ai-flask-rocm
    ports:
      - "${FRONTEND_PORT:-8000}:8000"
    environment:
      SERVICE_TYPE: "flask"
      TZ: "${TZ:-UTC}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: "audiomusedb"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      TEMP_DIR: "/app/temp_audio"
    volumes:
      - temp-audio-flask:/app/temp_audio
      - plugins-flask:/app/plugin/installed
    depends_on:
      - redis
      - postgres
      - plugin-catalog
    restart: unless-stopped

  audiomuse-ai-worker:
    build: *rocm-build
    image: audiomuse-ai-rocm:local
    container_name: audiomuse-ai-worker-rocm
    environment:
      SERVICE_TYPE: "worker"
      TZ: "${TZ:-UTC}"
      POSTGRES_USER: ${POSTGRES_USER:-audiomuse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiomusepassword}
      POSTGRES_DB: "audiomusedb"
      POSTGRES_HOST: "postgres"
      POSTGRES_PORT: "5432"
      REDIS_URL: "redis://redis:6379/0"
      TEMP_DIR: "/app/temp_audio"
      # cuML has no ROCm port; GPU clustering stays CPU. ONNX analysis uses the GPU.
      USE_GPU_CLUSTERING: "false"
      # Uncomment to pin to a specific AMD GPU (index or UUID):
      # HIP_VISIBLE_DEVICES: "0"
    # --- AMD GPU passthrough ---
    devices:
      - /dev/kfd
      - /dev/dri
    # Base image has no `render` group; pass host's numeric GIDs instead.
    # Find yours with: getent group render video
    group_add:
      - "${RENDER_GID:-105}"
      - "${VIDEO_GID:-39}"
    security_opt:
      - seccomp:unconfined
    ipc: host
    cap_add:
      - SYS_PTRACE
    volumes:
      - temp-audio-worker:/app/temp_audio
      - plugins-worker:/app/plugin/installed
      # Persist the MIOpen kernel cache so GPU kernels are not recompiled on every
      # restart (matches MIOPEN_CUSTOM_CACHE_DIR baked into docker/Dockerfile).
      - miopen-cache:/app/.cache/miopen
      # Persist the MIGraphX compiled-model cache (matches migraphx_model_cache_dir
      # set by the ROCm Accelerator plugin) so musicnn/CLAP aren't recompiled on
      # every container restart.
      - migraphx-cache:/app/.cache/migraphx
    depends_on:
      - redis
      - postgres
      - plugin-catalog
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  temp-audio-flask:
  temp-audio-worker:
  plugins-flask:
  plugins-worker:
  miopen-cache:
  migraphx-cache:
